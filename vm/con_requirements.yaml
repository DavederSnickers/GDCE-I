name: digress_req
channels:
  - conda-forge
  - defaults
  - "nvidia/label/cuda-11.8.0"

dependencies:
  - python=3.9
  - cudatoolkit=11.8
  - rdkit=2023.03.2
  - graph-tool=2.45
  - gcc_linux-64
  - gxx_linux-64
  - pip=24.0

  - pip:
      # PyTorch + CUDA 11.8
      - torch==2.0.1
      - torchvision==0.15.2
      - torchaudio==2.0.2

      # PyTorch Lightning + PyG + OGB
      - pytorch_lightning==2.0.4
      - torchmetrics==0.11.4
      - torch-geometric==2.3.1
      - ogb==1.3.6
      - wandb==0.15.4

      # weitere Pakete
      - numpy==1.23
      - scipy==1.11.0
      - pandas==1.4
      - matplotlib==3.7.1
      - networkx==2.8.7
      - tqdm==4.65.0
      - hydra-core==1.3.2
      - imageio==2.31.1
      - omegaconf==2.3.0
      - overrides==7.3.1
      - pyemd==1.0.0
      - PyGSP==0.5.1

