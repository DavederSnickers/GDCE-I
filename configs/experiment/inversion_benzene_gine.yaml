# @package _global_
# Auto-derived from inversion_benzene.yaml. Evaluates the diffusion model that was
# trained against the shared judge 'judge_benzene_gine', and measures flips with that
# same judge. Run name 'inv-benzene-gine' gives this run its own Hydra output dir,
# so the result CSVs of the five variants stay separate.

general:
    name: 'inv-benzene-gine'
    gpus: 1
    test_only: '${oc.env:GDCE_CKPT}/benzene_gine.ckpt'
    wandb: 'disabled'
    check_val_every_n_epochs: 50
    sample_every_val: 9999
    samples_to_generate: 20
    samples_to_save: 20
    log_every_steps: 100
    final_model_samples_to_generate: 30
    final_model_samples_to_save: 30

train:
    n_epochs: 3000
    batch_size: 256
    lr: 0.0002
    save_model: True
    ckpt_every_n_train_steps: 50
    num_interops_workers: 1

model:
    diffusion_steps: 500
    n_layers: 8
    lambda_train: [5, 0]
    extra_features: null
    hidden_mlp_dims: { 'X': 256, 'E': 128, 'y': 256 }
    hidden_dims: { 'dx': 256, 'de': 64, 'dy': 128, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 128, 'dim_ffy': 256 }

guidance:
    guidance_target: ['ring']
    p_uncond: 0.1
    trainable_cf: True
    guidance_medium: 'both'
    s: 3
    s_values: [3]
    #   'fresh'     — naive inversion: fresh Gumbel captured along the forward chain
    #   'posterior' — edit-friendly posterior Gumbel (exact reconstruction)
    #   'noinv'     — no inversion: original GDCE, fresh sampling per reverse step
    inversion_method: 'posterior'
    inversion_margin: 0.0
    n_runs: 5
    n_samples_per_run: 100
    compute_mmd: true
    require_valid: false
    recon_check: false
    run_counterfactual: false
    max_cf_images: 30           # rendered original|CF comparison PNGs
    stop_at_first_flip: true    # stop the t-scan at the first flip (no deeper
                                # search for a chemically valid one)
    n_samples_per_test_molecule: 10
    n_test_molecules_to_sample: 250
    build_with_partial_charges: "new"
    label_source: 'classifier'
    # GINE oracle, test/acc 0.9996
    graph_classifier_path: null
    shared_judge_path: '${oc.env:GDCE_JUDGES}/judge_benzene_gine'
